services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Windows / macOS のマウントでもファイル変更を検知する
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      # コンテナ内の node_modules と .next をホストで上書きしない
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
